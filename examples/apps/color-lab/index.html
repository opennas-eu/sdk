<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Lab</title>
<style>
  :root { --bg:#fff; --ink:#0f172a; --soft:#64748b; --line:#e2e8f0; }
  body.dark { --bg:#0f172a; --ink:#e2e8f0; --soft:#94a3b8; --line:#1e293b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif; padding:22px; }
  .swatch { height:150px; border-radius:18px; display:grid; place-items:center; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .swatch input { width:64px; height:64px; border:0; background:transparent; cursor:pointer; }
  .vals { margin:18px 0; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:center; gap:10px; background:transparent; border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; cursor:pointer; font-family:ui-monospace,Menlo,monospace; }
  .row span { color:var(--soft); width:42px; font-family:ui-sans-serif,system-ui; font-size:12px; }
  .row b { font-weight:500; }
  .row .copy { margin-left:auto; color:var(--soft); font-size:12px; font-family:ui-sans-serif; }
  .palette { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .palette div { height:48px; border-radius:10px; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  h3 { color:var(--soft); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin:18px 0 8px; }
</style></head>
<body>
  <label class="swatch" id="swatch"><input type="color" id="picker" value="#6366f1"></label>
  <div class="vals" id="vals"></div>
  <h3>Shades</h3>
  <div class="palette" id="palette"></div>

<script src="/app-sdk/opennas.js"></script>
<script>
  const picker = document.getElementById("picker"), swatch = document.getElementById("swatch"),
        vals = document.getElementById("vals"), palette = document.getElementById("palette");

  const hex2rgb = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
  function rgb2hsl(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b); let h=0,s=0,l=(mx+mn)/2;
    if(mx!==mn){const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn);
      h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; h/=6;}
    return [Math.round(h*360),Math.round(s*100),Math.round(l*100)]; }
  function shade(h,l){ return `hsl(${h[0]} ${h[1]}% ${l}%)`; }

  function copy(text, el){
    navigator.clipboard?.writeText(text);
    const c = el.querySelector(".copy"); if(c){ const o=c.textContent; c.textContent="Copied!"; setTimeout(()=>c.textContent=o,900); }
  }

  function update(){
    const hex = picker.value, [r,g,b] = hex2rgb(hex), hsl = rgb2hsl(r,g,b);
    swatch.style.background = hex;
    const items = [["HEX",hex.toUpperCase()],["RGB",`rgb(${r}, ${g}, ${b})`],["HSL",`hsl(${hsl[0]}, ${hsl[1]}%, ${hsl[2]}%)`]];
    vals.innerHTML = items.map(([k,v])=>`<div class="row" data-v="${v}"><span>${k}</span><b>${v}</b><span class="copy">copy</span></div>`).join("");
    vals.querySelectorAll(".row").forEach(r=> r.onclick=()=>copy(r.dataset.v, r));
    palette.innerHTML = [85,70,55,40,25].map(l=>{ const c=shade(hsl,l); return `<div title="${c}" data-c="${c}" style="background:${c}"></div>`; }).join("");
    palette.querySelectorAll("div").forEach(d=> d.onclick=()=>copy(d.dataset.c, d));
  }
  picker.addEventListener("input", update);
  update();

  window.OpenNAS?.ready?.().then(ctx=>{
    document.body.classList.toggle("dark", ctx.host.theme==="dark");
    window.OpenNAS.onThemeChange?.(t=>document.body.classList.toggle("dark", t==="dark"));
  }).catch(()=>{});
</script>
</body></html>
